name: Fix Codelight heading hierarchy

on:
  push:
    branches:
      - docs/codelight-manifesto
    paths:
      - .github/workflows/fix-codelight-headings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/codelight-manifesto

      - name: Fix only the three heading levels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CODELIGHT_MANIFESTO.md')
          text = path.read_text()

          replacements = {
              '### Agent Rule': '## Agent Rule',
              '### Current executable frontier': '## Current executable frontier',
              '### Planning horizon': '## Planning horizon',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -Fxq '## Agent Rule' CODELIGHT_MANIFESTO.md
          grep -Fxq '## Current executable frontier' CODELIGHT_MANIFESTO.md
          grep -Fxq '## Planning horizon' CODELIGHT_MANIFESTO.md

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-codelight-headings.yml
          git add CODELIGHT_MANIFESTO.md
          git commit -m 'docs: fix Codelight heading hierarchy'
          git push origin HEAD:docs/codelight-manifesto
